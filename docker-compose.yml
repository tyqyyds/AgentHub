version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agenthub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenthub}
      POSTGRES_USER: ${POSTGRES_USER:-agenthub_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenthub_app} -d ${POSTGRES_DB:-agenthub}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agenthub-net

  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agenthub-net

  orchestrator:
    build: 
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: agenthub-orchestrator
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-agenthub_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agenthub}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENV=${ENVIRONMENT:-production}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=agenthub-orchestrator
      - OTEL_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    networks:
      - agenthub-net

  agent-worker-1:
    build: 
      context: .
      dockerfile: Dockerfile.agent-worker
    container_name: agenthub-worker-1
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - AGENT_ID=worker-1
    depends_on:
      - orchestrator
      - redis
    networks:
      - agenthub-net

  agent-worker-2:
    build: 
      context: .
      dockerfile: Dockerfile.agent-worker
    container_name: agenthub-worker-2
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - AGENT_ID=worker-2
    depends_on:
      - orchestrator
      - redis
    networks:
      - agenthub-net

  mcp-registry:
    build: 
      context: .
      dockerfile: Dockerfile.mcp-registry
    container_name: agenthub-mcp-registry
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - redis
    networks:
      - agenthub-net

  a2a-gateway:
    build: 
      context: .
      dockerfile: Dockerfile.a2a-gateway
    container_name: agenthub-a2a-gateway
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ORCHESTRATOR_URL=http://orchestrator:8000
    depends_on:
      - orchestrator
      - redis
    ports:
      - "8080:8080"
    networks:
      - agenthub-net

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agenthub-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - orchestrator
    ports:
      - "5173:5173"
    networks:
      - agenthub-net

  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: agenthub-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - agenthub-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: agenthub-chromadb
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - agenthub-net

volumes:
  postgres_data:
  redis_data:
  chroma_data:

networks:
  agenthub-net:
    driver: bridge
