# API 基础配置
API_BASE_URL:

# 轮询间隔 (ms)
POLLING_INTERVAL:
  DASHBOARD: 5000
  INTENT_HISTORY: 3000
  RATE_LIMIT: 5000
  AUDIT_LOGS: 10000

# 防抖配置 (ms)
DEBOUNCE:
  SEARCH: 300
  VALIDATION: 500

# 功能开关
FEATURES:
  DEBUG_PANEL: false
  MOCK_DATA: false
  AUTO_SAVE: true

# UI 常量
UI:
  PAGE_SIZE: 20
  MAX_FILE_SIZE: 10485760  # 10MB
  TOAST_DURATION: 3000
  MODAL_ANIMATION_DURATION: 300

# 验证规则
VALIDATION:
  TOOL_NAME:
    MIN_LENGTH: 3
    MAX_LENGTH: 32
    PATTERN: '^[a-zA-Z][a-zA-Z0-9_]*$'
  TOOL_DESCRIPTION:
    MIN_LENGTH: 10
    MAX_LENGTH: 500
  PARAM_NAME:
    MIN_LENGTH: 2
    MAX_LENGTH: 32
  PARAM_DESCRIPTION:
    MIN_LENGTH: 10
    MAX_LENGTH: 200
  MAX_PARAMS: 10
